[project]
name = "proxy-pool"
version = "0.1.0"
description = "Public proxy scraper, checker, and API service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9.5",
    "aiohttp-socks>=0.8.4",
    "fastapi>=0.111.0",
    "rich>=13.7.1",
    "uvicorn[standard]>=0.30.1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
]

[project.scripts]
proxy-pool = "proxy_pool.app:main"
proxy-pool-scrape = "proxy_pool.checker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["proxy_pool"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
